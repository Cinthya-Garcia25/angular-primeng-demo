<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-brand">
    <i class="pi pi-th-large"></i>
    @if (!collapsed) {
    <span>Workspace</span>
    }
  </div>

  <nav class="sidebar-nav">
    <a *ifHasPermission="'ticket:view'" pButton class="p-button-text p-button-secondary nav-item"
      [routerLink]="['/pages/group-dashboard']" routerLinkActive="active-link">
      <i class="pi pi-home"></i>
      @if (!collapsed) {
      <span>Dashboard</span>
      }
    </a>

    <a *ifHasPermission="'ticket:view'" pButton class="p-button-text p-button-secondary nav-item"
      [routerLink]="['/pages/kanban']" routerLinkActive="active-link">
      <i class="pi pi-table"></i>
      @if (!collapsed) {
      <span>Tablero Kanban</span>
      }
    </a>

    <a *ifHasPermission="'group:view'" pButton class="p-button-text p-button-secondary nav-item"
      [routerLink]="['/pages/groups']" routerLinkActive="active-link">
      <i class="pi pi-users"></i>
      @if (!collapsed) {
      <span>Groups</span>
      }
    </a>

    <a *ifHasPermission="'group:edit'" pButton class="p-button-text p-button-secondary nav-item"
      [routerLink]="['/pages/group-settings']" routerLinkActive="active-link">
      <i class="pi pi-cog"></i>
      @if (!collapsed) {
      <span>Group Settings</span>
      }
    </a>

    <a *ifHasPermission="'users:view'" pButton class="p-button-text p-button-secondary nav-item"
      [routerLink]="['/pages/user-management']" routerLinkActive="active-link">
      <i class="pi pi-id-card"></i>
      @if (!collapsed) {
      <span>User Management</span>
      }
    </a>

    <a *ifHasPermission="'ticket:view'" pButton class="p-button-text p-button-secondary nav-item"
      [routerLink]="['/pages/tickets']" routerLinkActive="active-link">
      <i class="pi pi-list"></i>
      @if (!collapsed) {
      <span>Tickets List</span>
      }
    </a>
  </nav>

  <div class="sidebar-version">
    <span>{{ appVersion }}</span>
  </div>
</aside>
